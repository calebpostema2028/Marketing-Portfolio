<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="Caleb Postema's marketing resume." name="description"/>
  <title>Caleb Postema - Resume</title>
  <style>
    *{ box-sizing:border-box; }
    html{ background:#171512; }
    body{
      margin:0;
      min-height:100vh;
      padding:clamp(12px, 3vw, 36px);
      display:flex;
      justify-content:center;
      background:
        radial-gradient(ellipse at top, rgba(255,255,255,.045), transparent 58%),
        #171512;
    }
    .resume{
      display:block;
      width:min(100%, 850px);
      height:auto;
      align-self:flex-start;
      background:#fff;
      box-shadow:0 22px 60px rgba(0,0,0,.55);
    }
    @media print{
      html, body{ background:#fff; }
      body{ padding:0; }
      .resume{ width:100%; box-shadow:none; }
    }
  </style>
</head>
<body>
  <img class="resume" src="resume.png" alt="Caleb Postema resume"/>
</body>
</html>
